# You may uncomment the following config to activate different spring profiles
#spring.profiles.active=github,consul-discovery
#spring.profiles.active=github,zookeeper-discovery
#spring.profiles.active=github,custom-defined-discovery
#spring.profiles.active=github,database-discovery

# --- 数据库动态切换（改配置后重启生效） ---
# 仅激活选中的数据库 Profile，其它库型配置不会被加载，避免污染切换目标库。
# 连接(url/用户名/密码)通过 SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD 注入。
#   MySQL      : SPRING_PROFILES_ACTIVE=github,mysql
#   PostgreSQL : SPRING_PROFILES_ACTIVE=github,postgre   URL=jdbc:postgresql://...
#   达梦 DM8   : SPRING_PROFILES_ACTIVE=github,dm        URL=jdbc:dm://...?SCHEMA=...  (需先安装 DmJdbcDriver8.jar)
#   人大金仓   : SPRING_PROFILES_ACTIVE=github,kingbase  URL=jdbc:postgresql://...（PG 模式）
# 无数据库 Profile 时默认使用 mysql（便于本地开发）。参见 README-Database-Switching.md。
spring.profiles.default = mysql

# true: enabled the new feature of audit log
# false/missing: disable it
apollo.audit.log.enabled = true
