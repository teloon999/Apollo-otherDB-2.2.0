# =====================================================================
# PostgreSQL Profile
# =====================================================================
# 通过激活本 Profile 使用 PostgreSQL：
#   配置 spring.profiles.active（或环境变量 apollo_profile）包含 postgre：
#     例如：SPRING_PROFILES_ACTIVE=postgre，或启动时 -Dspring.profiles.active=postgre
#
# PostgreSQL 驱动已包含，Hibernate 依据 jdbc:postgresql:// URL 自动识别
# PG 方言，无需额外配置。连接信息通过环境变量注入：
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:<port>/<database>
#   SPRING_DATASOURCE_USERNAME=<user>
#   SPRING_DATASOURCE_PASSWORD=<password>
# =====================================================================