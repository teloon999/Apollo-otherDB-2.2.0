# =====================================================================
# KingbaseES (人大金仓) PG 模式 Profile
# =====================================================================
# 通过激活本 Profile 使用人大金仓数据库（PG 模式）：
#   配置 spring.profiles.active（或环境变量 apollo_profile）包含 kingbase：
#     例如：SPRING_PROFILES_ACTIVE=kingbase，或启动时 -Dspring.profiles.active=kingbase
#
# 人大金仓 PG 模式与 PostgreSQL 高度兼容，复用 PostgreSQL JDBC 驱动，
# Hibernate 依据 jdbc:postgresql:// URL 自动识别 PG 方言，无需额外配置。
#
# 连接信息（url / username / password）按基线机制通过环境变量注入：
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:<port>/<database>
#   SPRING_DATASOURCE_USERNAME=<user>
#   SPRING_DATASOURCE_PASSWORD=<password>
# =====================================================================