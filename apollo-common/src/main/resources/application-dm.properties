# =====================================================================
# Dameng (DM8) 数据库 Profile
# =====================================================================
# 通过激活本 Profile 使用达梦数据库：
#   配置 spring.profiles.active（或环境变量 apollo_profile）包含 dm：
#     例如：SPRING_PROFILES_ACTIVE=dm，或启动时 -Dspring.profiles.active=dm
#
# 连接信息（url / username / password）按基线机制通过环境变量注入：
#   SPRING_DATASOURCE_URL=jdbc:dm://<host>:<port>?SCHEMA=APOLLOCONFIGDB
#   SPRING_DATASOURCE_USERNAME=<user>
#   SPRING_DATASOURCE_PASSWORD=<password>
#
# 达梦无法被 Hibernate 自动识别，必须显式指定驱动与方言：
#   驱动：dm.jdbc.driver.DmDriver
#   方言：DamengDialect（处理 DM8 分页 OFFSET..FETCH、IDENTITY 列、主键回取等差异）
# =====================================================================

spring.datasource.driver-class-name = dm.jdbc.driver.DmDriver
spring.jpa.database-platform = com.ctrip.framework.apollo.common.jpa.DamengDialect